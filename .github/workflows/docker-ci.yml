name: Todo App Docker CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        id: vars
        run: |
          SHA_SHORT=${GITHUB_SHA::7}
          echo "BACKEND_IMAGE=${{ secrets.DOCKERHUB_BACKEND_REPO }}:${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "FRONTEND_IMAGE=${{ secrets.DOCKERHUB_FRONTEND_REPO }}:${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "BACKEND_IMAGE_LATEST=${{ secrets.DOCKERHUB_BACKEND_REPO }}:latest" >> $GITHUB_OUTPUT
          echo "FRONTEND_IMAGE_LATEST=${{ secrets.DOCKERHUB_FRONTEND_REPO }}:latest" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ steps.vars.outputs.BACKEND_IMAGE }}
            ${{ steps.vars.outputs.BACKEND_IMAGE_LATEST }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ steps.vars.outputs.FRONTEND_IMAGE }}
            ${{ steps.vars.outputs.FRONTEND_IMAGE_LATEST }}
